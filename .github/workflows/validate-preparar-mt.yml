name: Validate Preparar MT

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/preparar-mt]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/validate_preparar_mt.py
